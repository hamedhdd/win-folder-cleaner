[package]
name = "win-folder-cleaner"
version = "0.1.0"
edition = "2021"
authors = ["Hamed <hamedhdd>"]
description = "Windows Folder Analyzer & Advanced Cleaner in Rust"

[lib]
name = "win_folder_cleaner"
path = "src/lib.rs"

[[bin]]
name = "win-folder-cleaner"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.29"
egui_extras = "0.29"
crossbeam-channel = "0.5"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
]
